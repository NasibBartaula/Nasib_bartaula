<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Nasib Bartaula</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00F5FF;
      --secondary: #6C63FF;
      --bg: #050816;
      --text: #FFFFFF;
      --text-muted: #9CA3AF;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800;
      background: linear-gradient(135deg, #00F5FF, #6C63FF, #7B61FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-muted);
      margin-bottom: 32px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #00F5FF, #6C63FF);
      color: #050816;
      text-decoration: none;
      border-radius: 50px;
      font-weight: 600;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 245, 255, 0.3);
    }
    .glitch {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      color: var(--primary);
      margin-top: 24px;
      opacity: 0.6;
    }
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.3;
      pointer-events: none;
    }
    .blob-1 { width: 400px; height: 400px; background: #00F5FF; top: -10%; right: -10%; animation: blobFloat 8s ease-in-out infinite; }
    .blob-2 { width: 300px; height: 300px; background: #6C63FF; bottom: -10%; left: -5%; animation: blobFloat 8s ease-in-out infinite reverse; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -20px); }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="container">
    <div class="error-code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="index.html" class="btn">← Back to Home</a>
    <p class="glitch">// Error: route_not_found()</p>
  </div>
</body>
</html>
